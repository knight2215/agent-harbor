name: CI

# CI pipeline (tasks.md P0.6, extended in Phase 1 / P1.1).
#
# TWO-JOB STRUCTURE (introduced to keep the routine per-push signal fast):
#
#   1. `build` (routine gate) - runs on EVERY push and pull_request across the
#      ubuntu + windows matrix. It is the authoritative correctness gate:
#      `cargo fmt --check`, `cargo build/test/clippy` over every crate
#      individually via `--manifest-path` (the workspace has no members - see
#      below), plus the frontend install / ESLint / Prettier / vitest suite. It
#      does NOT bundle a
#      Tauri installer, so it finishes in a few minutes instead of ~40.
#
#   2. `tauri-bundle` (gated release check) - runs ONLY on manual dispatch
#      (`workflow_dispatch`) and on version-tag pushes (`tags: ['v*']`). It
#      installs a PREBUILT Tauri v2 CLI (via taiki-e/install-action, avoiding the
#      ~10-15 min source compile of `cargo install tauri-cli`) and runs
#      `cargo tauri build` on the ubuntu + windows matrix to validate the full
#      installer bundle. This is the slow step that used to run on every push;
#      it now runs only when a release bundle is actually wanted.
#
# Both jobs are independent (each re-does its own checkout / toolchain / Linux
# system deps / node / cargo cache).
#
# Unlike the offline sandbox, GitHub Actions has network access, so this is the
# authoritative place where the FULL build is exercised: the offline-buildable
# library crate AND the crates that carry crates.io dependencies (which are
# unreachable offline), plus the npm dependencies for the frontend.
#
# IMPORTANT WORKSPACE ARRANGEMENT:
#   Some crates are under `[workspace] exclude` in hybrid-orchestrator/
#   Cargo.toml (NOT `members`) because they depend on crates.io crates that are
#   unreachable in the offline sandbox:
#     - crates/tauri-app         -> `tauri` + `tauri-build` (since Phase 0)
#     - crates/domain            -> serde/serde_json/uuid/chrono + secrets
#                                   (Phase 1 / FEAT-004 cycle-break)
#     - crates/orchestrator-core -> serde/serde_json/uuid/chrono/thiserror
#                                   + tokio (since Phase 1 / FEAT-001-002)
#     - crates/persistence       -> sqlx + tokio + serde/... (Phase 1 / FEAT-002)
#     - crates/secrets           -> keyring + serde + thiserror (Phase 1 / FEAT-002)
#     - crates/providers         -> reqwest (rustls-tls) + futures + tokio +
#                                   async-trait + aws-sigv4/aws-credential-types
#                                   (Phase 2 / FEAT-001; tests use mocked HTTP+SSE)
#     - crates/mcp-client        -> tokio (process/io/sync/time) + serde_json
#                                   (in-crate JSON-RPC) + reqwest (rustls-tls) +
#                                   rustls/ring (HTTP/SSE transport; the SSE
#                                   decoder is a plain str::split, no futures)
#                                   + async-trait + thiserror
#                                   (Phase 3 / FEAT-001; stdio tests spawn a
#                                   bundled cross-platform mock MCP server bin)
#     - crates/routing           -> async-trait + serde/serde_json + thiserror
#                                   plus path deps on providers + domain, which
#                                   pull in the crates.io HTTP/DB/keyring stack
#                                   transitively (Phase 4 / FEAT-001; unit tests
#                                   use no live network)
#   After Phase 4 NO crate remains an offline-buildable `members` entry: every
#   crate now carries crates.io deps (directly or transitively), so the
#   `members` array in hybrid-orchestrator/Cargo.toml is empty. With no members
#   there is nothing for `cargo fmt --all` or `cargo {build,test,clippy}
#   --workspace` to act on, so CI does NOT run any workspace-level cargo step;
#   instead it fmt-checks/builds/tests/clippies each excluded crate EXPLICITLY
#   via `--manifest-path crates/<crate>/Cargo.toml`. The gated
#   `tauri-bundle` job's `tauri build` step compiles tauri-app (and,
#   transitively, orchestrator-core) as part of bundling the installer as well.
#
#   DEPENDENCY GRAPH (strictly downward, acyclic - architecture.md Section 3.3):
#   the Section 7.1 domain DTOs live in the leaf `domain` crate; both
#   `orchestrator-core` and `persistence` depend DOWNWARD on `domain`
#   (`orchestrator-core -> {domain, persistence}`, `persistence -> domain`,
#   `domain -> secrets`). `persistence` does NOT depend back on
#   `orchestrator-core` (that reverse edge previously formed a hard `cargo`
#   cyclic-dependency error that would have made these per-crate builds fail to
#   resolve; FEAT-004 removed it). Because the graph is acyclic, building
#   `orchestrator-core` standalone pulls `domain`/`persistence`/`secrets` in
#   through their `path` deps and `cargo` resolves them cleanly here in CI.
#
# SECRETS ON HEADLESS CI: the `secrets` crate's automated tests use an
# in-memory store (`InMemorySecretStore`); the keyring-backed test is
# `#[ignore]`d because headless Linux CI has no Secret Service. `cargo test`
# therefore does not require an OS keychain.

on:
  push:
    # Routine `build` runs on pushes to any branch. Listing `branches` here is
    # required because once a `tags` filter is present, GitHub would otherwise
    # only fire the push event for matching tags.
    branches:
      - "**"
    # Version-tag pushes additionally trigger the gated `tauri-bundle` job.
    tags:
      - "v*"
  pull_request:
  # Manual trigger, primarily so the gated `tauri-bundle` job can be run on
  # demand without cutting a release tag.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS intentionally omitted for now: GitHub bills macOS runners at
        # 10x, and Linux + Windows already cover the cross-platform issues that
        # matter here (line endings, path handling, the Windows webview build).
        # Re-add macos-latest when macOS coverage / release bundles are needed.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # All commands below run from the Cargo workspace root unless a step
        # overrides `working-directory` (the frontend steps do).
        working-directory: hybrid-orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Tauri v2 Linux system dependencies. Required to COMPILE tauri-app on
      # ubuntu (the `cargo build --manifest-path crates/tauri-app/...` step below
      # still runs in this routine job). Windows ships the needed webview
      # (WebView2) so it does not need this step.
      - name: Install Tauri v2 Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
        working-directory: .

      # NOTE: `cache: npm` is intentionally NOT enabled here. setup-node's npm
      # cache requires an existing lockfile at `cache-dependency-path`, and it
      # errors hard (does not silently skip) when the file is absent. The Phase
      # 0 sandbox is offline, so `frontend/package-lock.json` cannot be
      # generated/committed until the first networked CI run produces it. Once
      # that lockfile is committed, re-enable caching by adding:
      #     cache: npm
      #     cache-dependency-path: hybrid-orchestrator/frontend/package-lock.json
      # and switch the install step below to a plain `npm ci`.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            hybrid-orchestrator/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('hybrid-orchestrator/**/Cargo.lock', 'hybrid-orchestrator/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # --- Rust: per-crate checks ---------------------------------------------
      # The workspace has NO members: every crate is `[workspace] exclude`d
      # (they all carry crates.io deps, directly or transitively, that are
      # unreachable in the offline sandbox). There is therefore nothing for a
      # `cargo fmt --all` / `cargo {build,test,clippy} --workspace` invocation to
      # act on, so each crate is fmt-checked / built / clippied / tested
      # individually via `--manifest-path` below.
      - name: cargo fmt (check, orchestrator-core)
        run: cargo fmt --manifest-path crates/orchestrator-core/Cargo.toml --check

      - name: cargo fmt (check, persistence)
        run: cargo fmt --manifest-path crates/persistence/Cargo.toml --check

      - name: cargo fmt (check, secrets)
        run: cargo fmt --manifest-path crates/secrets/Cargo.toml --check

      - name: cargo fmt (check, domain)
        run: cargo fmt --manifest-path crates/domain/Cargo.toml --check

      - name: cargo fmt (check, tauri-app)
        run: cargo fmt --manifest-path crates/tauri-app/Cargo.toml --check

      - name: cargo fmt (check, providers)
        run: cargo fmt --manifest-path crates/providers/Cargo.toml --check

      - name: cargo fmt (check, mcp-client)
        run: cargo fmt --manifest-path crates/mcp-client/Cargo.toml --check

      - name: cargo fmt (check, routing)
        run: cargo fmt --manifest-path crates/routing/Cargo.toml --check

      # --- Rust: secrets (excluded from the workspace, built explicitly) ------
      # secrets is under `[workspace] exclude` because it carries the crates.io
      # `keyring` dep, unreachable offline (Phase 1 / FEAT-002). Its automated
      # tests use the in-memory store; the keyring-backed test is `#[ignore]`d
      # so no OS keychain / Secret Service is required.
      - name: cargo build (secrets)
        run: cargo build --manifest-path crates/secrets/Cargo.toml

      - name: cargo clippy (secrets)
        run: cargo clippy --manifest-path crates/secrets/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (secrets)
        run: cargo test --manifest-path crates/secrets/Cargo.toml

      # --- Rust: domain (excluded from the workspace, built explicitly) -------
      # domain is under `[workspace] exclude` because it carries crates.io deps
      # (serde/serde_json/uuid/chrono) unreachable offline (Phase 1 / FEAT-004).
      # It is the LEAF crate that owns the Section 7.1 DTOs; both
      # orchestrator-core and persistence depend downward on it, which is what
      # keeps the crate graph acyclic. Built before persistence/orchestrator-core
      # since they path-depend on it (it depends only on `secrets`).
      - name: cargo build (domain)
        run: cargo build --manifest-path crates/domain/Cargo.toml

      - name: cargo clippy (domain)
        run: cargo clippy --manifest-path crates/domain/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (domain)
        run: cargo test --manifest-path crates/domain/Cargo.toml

      # --- Rust: persistence (excluded from the workspace, built explicitly) --
      # persistence is under `[workspace] exclude` because it carries crates.io
      # deps (sqlx + tokio + ...) unreachable offline (Phase 1 / FEAT-002). Its
      # tests run migrations + CRUD against a temp/in-memory SQLite DB (no
      # external services). Its `path` dep on the leaf `domain` crate (for the
      # Section 7.1 DTOs) is resolved transitively here. It does NOT depend on
      # orchestrator-core (FEAT-004 removed that reverse edge / cycle).
      - name: cargo build (persistence)
        run: cargo build --manifest-path crates/persistence/Cargo.toml

      - name: cargo clippy (persistence)
        run: cargo clippy --manifest-path crates/persistence/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (persistence)
        run: cargo test --manifest-path crates/persistence/Cargo.toml

      # --- Rust: providers (excluded from the workspace, built explicitly) ----
      # providers is under `[workspace] exclude` because Phase 2 (FEAT-001) gave
      # it crates.io deps unreachable offline: reqwest (rustls-tls) + SSE stream,
      # futures/futures-util (BoxStream), tokio, async-trait,
      # serde/serde_json/thiserror, and aws-sigv4 + aws-credential-types for the
      # Bedrock adapter (P2.9). The `--workspace` commands above do NOT touch it.
      # Build/test/clippy it directly via its manifest; its `path` deps on the
      # excluded `domain`/`secrets` crates are resolved transitively here. Its
      # tests use MOCKED HTTP + SSE (wiremock) and fixture byte buffers, never
      # live network. (The fmt-check step lives with the other per-crate
      # fmt-check steps near the top of the job.)
      - name: cargo build (providers)
        run: cargo build --manifest-path crates/providers/Cargo.toml

      - name: cargo clippy (providers)
        run: cargo clippy --manifest-path crates/providers/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (providers)
        run: cargo test --manifest-path crates/providers/Cargo.toml

      # --- Rust: mcp-client (excluded from the workspace, built explicitly) ---
      # mcp-client is under `[workspace] exclude` because Phase 3 (FEAT-001) gave
      # it crates.io deps unreachable offline: tokio (process/io/sync/time for
      # the stdio transport + per-tool timeouts), serde/serde_json (the in-crate
      # JSON-RPC 2.0 layer), reqwest (rustls-tls) + rustls/`ring` (the HTTP/SSE
      # transport; the SSE decoder is a plain `str::split` over the buffered POST
      # body, so no futures/bytes stream machinery), async-trait (the
      # `Transport` trait), and thiserror.
      # The `--workspace` commands above do NOT touch it. Build/test/clippy it
      # directly via its manifest; its `path` deps on the excluded
      # `domain`/`providers` crates are resolved transitively here. Built BEFORE
      # orchestrator-core, which path-depends on it. Its stdio tests spawn a
      # bundled cross-platform mock MCP server (`mcp-mock-server` `[[bin]]`),
      # never live network; the HTTP/SSE transport is exercised against a mocked
      # server. (The fmt-check step lives with the other per-crate fmt-check
      # steps near the top of the job.)
      - name: cargo build (mcp-client)
        run: cargo build --manifest-path crates/mcp-client/Cargo.toml

      - name: cargo clippy (mcp-client)
        run: cargo clippy --manifest-path crates/mcp-client/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (mcp-client)
        run: cargo test --manifest-path crates/mcp-client/Cargo.toml

      # --- Rust: routing (excluded from the workspace, built explicitly) ------
      # routing is under `[workspace] exclude` because Phase 4 (FEAT-001) gave it
      # path deps on `providers` and `domain`, which carry the crates.io HTTP/DB/
      # keyring stack transitively (reqwest/sqlx/keyring/...) - unreachable
      # offline. The `--workspace` commands above do NOT touch it. Build/test/
      # clippy it directly via its manifest; its `path` deps on the excluded
      # `providers`/`domain` crates are resolved transitively here. Built AFTER
      # providers + domain (which it depends on) and BEFORE orchestrator-core
      # (which path-depends on routing). Its unit tests build in-memory
      # `AvailableModel` candidates directly, so they use no live network.
      - name: cargo build (routing)
        run: cargo build --manifest-path crates/routing/Cargo.toml

      - name: cargo clippy (routing)
        run: cargo clippy --manifest-path crates/routing/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (routing)
        run: cargo test --manifest-path crates/routing/Cargo.toml

      # --- Rust: orchestrator-core (excluded from the workspace, built explicitly)
      # orchestrator-core is under `[workspace] exclude` because it carries
      # crates.io deps (serde/serde_json/uuid/chrono/thiserror + tokio) that are
      # unreachable offline (Phase 1 / FEAT-001-002). The `--workspace` commands
      # above do NOT touch it. Build/test/clippy it directly via its manifest;
      # its `path` deps on the member libs AND on domain/persistence are resolved
      # transitively here (the graph is acyclic after the FEAT-004 cycle-break).
      - name: cargo build (orchestrator-core)
        run: cargo build --manifest-path crates/orchestrator-core/Cargo.toml

      - name: cargo clippy (orchestrator-core)
        run: cargo clippy --manifest-path crates/orchestrator-core/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (orchestrator-core)
        run: cargo test --manifest-path crates/orchestrator-core/Cargo.toml

      # --- Rust: tauri-app (excluded from the workspace, built explicitly) ----
      # tauri-app is under `[workspace] exclude`, so the `--workspace` commands
      # above do NOT touch it. Build/test/clippy it directly via its manifest.
      # (The full installer bundle is validated separately in the gated
      # `tauri-bundle` job, not here.)
      - name: cargo build (tauri-app)
        run: cargo build --manifest-path crates/tauri-app/Cargo.toml

      - name: cargo clippy (tauri-app)
        run: cargo clippy --manifest-path crates/tauri-app/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (tauri-app)
        run: cargo test --manifest-path crates/tauri-app/Cargo.toml

      # --- Frontend: install, lint, test --------------------------------------
      - name: npm install (frontend)
        working-directory: hybrid-orchestrator/frontend
        # Prefer the reproducible `npm ci`; fall back to `npm install` when the
        # lockfile does not exist yet (the offline Phase 0 sandbox cannot
        # generate one). The first networked run takes the `npm install` path
        # and produces `package-lock.json`; commit that file (per the README
        # lockfile policy) and switch this to a plain `npm ci` afterwards.
        run: npm ci || npm install

      - name: npm run lint (frontend)
        working-directory: hybrid-orchestrator/frontend
        run: npm run lint

      - name: npm run format:check (frontend)
        working-directory: hybrid-orchestrator/frontend
        run: npm run format:check

      - name: npm run test (frontend vitest)
        working-directory: hybrid-orchestrator/frontend
        run: npm run test

  # --- Gated Tauri installer bundle ----------------------------------------
  # This job carries the two expensive steps that used to run on every push and
  # dominated the ~40 min CI time: installing the Tauri v2 CLI and running
  # `cargo tauri build` to bundle a full installer. It is gated so it only runs
  # when a release bundle is actually wanted:
  #   - `workflow_dispatch` (manual, on-demand), and
  #   - `push` of a version tag (`v*`, e.g. `v0.1.0`).
  # It runs on the ubuntu + windows matrix so cross-platform bundling is
  # validated at release / manual time. The job is independent of `build`: it
  # re-does its own checkout / toolchain / Linux system deps / node / cargo
  # cache.
  #
  # After bundling, every run (incl. `workflow_dispatch`) uploads the produced
  # installers as downloadable workflow artifacts (per-OS keyed). On `v*` tag
  # pushes it additionally attaches those installers to a GitHub Release for the
  # tag (creating the release if absent). Publishing a release needs
  # `contents: write`, granted via the job-scoped `permissions` block below so
  # the routine `build` job stays implicitly read-only.
  tauri-bundle:
    name: tauri-bundle (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # Job-scoped so only this job can create/update a Release; `build` remains
    # implicitly read-only.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Match the routine job's matrix: no macOS (see the note there).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: hybrid-orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      # Same Tauri v2 Linux system deps as the routine job; required both to
      # compile tauri-app and to run `tauri build` on ubuntu. Windows ships
      # WebView2, so it does not need this step.
      - name: Install Tauri v2 Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
        working-directory: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            hybrid-orchestrator/target
          key: ${{ runner.os }}-cargo-bundle-${{ hashFiles('hybrid-orchestrator/**/Cargo.lock', 'hybrid-orchestrator/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bundle-
            ${{ runner.os }}-cargo-

      # Install a PREBUILT Tauri v2 CLI instead of `cargo install tauri-cli`,
      # which compiles the CLI from source (~10-15 min per OS). taiki-e's
      # install-action fetches a prebuilt `cargo-tauri` binary in seconds.
      - name: Install Tauri CLI (v2, prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.1.0

      # Install the frontend deps BEFORE `tauri build`. Tauri's
      # `beforeBuildCommand` runs `npm run build` (`tsc && vite build`), which
      # needs `node_modules/.bin/{tsc,vite}` present. Mirrors the routine
      # `build` job's install step. (`npm ci` falls back to `npm install` while
      # there is no committed package-lock.json.)
      - name: npm install (frontend)
        working-directory: hybrid-orchestrator/frontend
        run: npm ci || npm install

      # Bundles the app. This compiles tauri-app and the frontend production
      # build, catching bundling / capability / COPY-path issues that unit tests
      # miss (tasks.md P0.6).
      #
      # Phase 8b (signed auto-updater): the two TAURI_SIGNING_* env vars below
      # are pre-configured repository secrets that drive the updater signing.
      # With `plugins.updater.pubkey` set in tauri.conf.json (FEAT-001), the
      # presence of TAURI_SIGNING_PRIVATE_KEY (+ its password) makes
      # `cargo tauri build` emit updater artifacts alongside a minisign `.sig`
      # signature file for each (e.g. *.AppImage.sig, *.exe.sig, *.msi.sig).
      # The private key is NEVER stored in the repo; only these `${{ secrets.* }}`
      # references appear here, and the matching PUBLIC key lives in
      # tauri.conf.json for the client to verify downloaded updates against.
      - name: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --config crates/tauri-app/tauri.conf.json

      # Upload the installers produced above as downloadable workflow artifacts
      # on EVERY tauri-bundle run (incl. workflow_dispatch). The OS-keyed name
      # prevents the two matrix legs from colliding. `path` is repo-root-relative
      # for upload-artifact regardless of the job's `working-directory` default,
      # so the bundle globs carry the `hybrid-orchestrator/target/...` prefix.
      # Each OS only produces its own formats; `if-no-files-found: warn` lets the
      # non-matching globs match nothing without failing the step.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: agent-harbor-installers-${{ matrix.os }}
          # tauri-app is a `[workspace] exclude`d crate, so `cargo tauri build`
          # writes its bundle output under the CRATE's own target dir
          # (crates/tauri-app/target/...), NOT the workspace root target/.
          #
          # Phase 8b: also collect the minisign `.sig` signature files that
          # `cargo tauri build` emits for the updater bundles (AppImage on
          # Linux, NSIS .exe / MSI on Windows). The downstream
          # `publish-updater-manifest` job reads these `.sig` contents to
          # compose latest.json. `if-no-files-found: warn` keeps each OS's
          # non-matching globs from failing the step.
          path: |
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/deb/*.deb
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/rpm/*.rpm
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/appimage/*.AppImage
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/appimage/*.AppImage.sig
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/msi/*.msi
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/msi/*.msi.sig
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/nsis/*.exe
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn
          retention-days: 14

      # On `v*` tag pushes only, attach the same installers to the tag's GitHub
      # Release (created if absent). Both matrix legs append their assets to the
      # same release, which is intended. `fail_on_unmatched_files: false` so an
      # OS's non-matching globs don't fail the step.
      - name: Publish installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Phase 8b: publish the updater `.sig` signature files to the Release
          # too, so the updater client can fetch and verify them. The AppImage /
          # NSIS .exe assets referenced from latest.json are attached here; their
          # `.sig` contents are additionally inlined into latest.json by the
          # `publish-updater-manifest` job. `fail_on_unmatched_files: false` so
          # an OS's non-matching globs don't fail the step.
          files: |
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/deb/*.deb
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/rpm/*.rpm
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/appimage/*.AppImage
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/appimage/*.AppImage.sig
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/msi/*.msi
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/msi/*.msi.sig
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/nsis/*.exe
            hybrid-orchestrator/crates/tauri-app/target/release/bundle/nsis/*.exe.sig
          fail_on_unmatched_files: false
          generate_release_notes: true

  # --- Publish the updater manifest (latest.json) --------------------------
  # Phase 8b (signed auto-updater aggregation): after BOTH matrix legs of
  # `tauri-bundle` have produced their installers + `.sig` signatures, this job
  # composes the single cross-platform `latest.json` manifest that the Tauri
  # updater plugin polls, and uploads it as an asset on the tag's GitHub
  # Release.
  #
  # RELEASE-ASSET URL NAMING ASSUMPTIONS (documented so future maintainers can
  # reason about the update flow):
  #   * tauri.conf.json's updater `endpoints` points at
  #       https://github.com/knight2215/agent-harbor/releases/latest/download/latest.json
  #     GitHub resolves `releases/latest/download/<name>` to the asset `<name>`
  #     on the NEWEST published (non-draft, non-prerelease) release, so as long
  #     as each `v*` tag's release carries a `latest.json`, clients always fetch
  #     the newest one without the URL ever changing.
  #   * The per-platform update artifacts are the AppImage (linux-x86_64) and the
  #     NSIS .exe (windows-x86_64). Their filenames EMBED the app version (0.4.0
  #     for this phase, e.g. `agent-harbor_0.4.0_amd64.AppImage`), so the exact
  #     names are resolved at runtime from the downloaded artifacts via glob +
  #     basename rather than hardcoded, and the download URLs are composed
  #     against
  #       https://github.com/knight2215/agent-harbor/releases/download/${GITHUB_REF_NAME}/<filename>
  #     which is where the `Publish installers to GitHub Release` step above
  #     attaches them for this same tag.
  #   * Each platform's `signature` field is the VERBATIM contents of that
  #     artifact's `.sig` file; `jq` is used to build the JSON so the signature
  #     text is escaped correctly.
  #
  # Runs only on `v*` tag pushes (a release must exist to attach the asset to),
  # needs both bundle legs, and needs `contents: write` to upload the asset.
  publish-updater-manifest:
    name: publish-updater-manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tauri-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Pull BOTH OS artifacts uploaded by the tauri-bundle matrix legs into a
      # single working tree. Each artifact expands into its own subdirectory
      # under `artifacts/` (download-artifact preserves the artifact name), and
      # the bundle files retain their `hybrid-orchestrator/crates/...` path
      # prefix from the upload globs.
      - name: Download installer artifacts (both OSes)
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: agent-harbor-installers-*

      # Compose latest.json from the downloaded per-platform bundles + `.sig`
      # files. Uses `jq` (pre-installed on ubuntu-latest runners) so the
      # signature contents are JSON-escaped correctly.
      - name: Compose latest.json
        run: |
          set -euo pipefail

          # Version is the tag without the leading `v` (e.g. v0.4.0 -> 0.4.0).
          VERSION="${GITHUB_REF_NAME#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Resolve the actual per-platform update-artifact + signature file
          # paths from the downloaded artifacts. The filenames embed the version,
          # so glob for them rather than hardcoding. `find` handles the nested
          # per-artifact + bundle-path directory layout.
          LINUX_APPIMAGE="$(find artifacts -type f -name '*.AppImage' | head -n1)"
          LINUX_SIG="$(find artifacts -type f -name '*.AppImage.sig' | head -n1)"
          # Restrict to the NSIS bundle subpath so a stray non-installer `.exe`
          # (if any is ever bundled) can never be selected as the updater target.
          WINDOWS_EXE="$(find artifacts -type f -path '*/nsis/*.exe' | head -n1)"
          WINDOWS_SIG="$(find artifacts -type f -path '*/nsis/*.exe.sig' | head -n1)"

          # Fail loudly if any expected update artifact / signature is missing:
          # latest.json MUST cover both platforms for the updater to work.
          for f in "$LINUX_APPIMAGE" "$LINUX_SIG" "$WINDOWS_EXE" "$WINDOWS_SIG"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then
              echo "::error::Missing an expected updater artifact or signature (linux AppImage/.sig or windows .exe/.sig)." >&2
              echo "Resolved: LINUX_APPIMAGE='$LINUX_APPIMAGE' LINUX_SIG='$LINUX_SIG' WINDOWS_EXE='$WINDOWS_EXE' WINDOWS_SIG='$WINDOWS_SIG'" >&2
              exit 1
            fi
          done

          # Basenames feed the release download URLs (assets are attached to the
          # tag's release under their bare filenames by the publish step above).
          LINUX_FILE="$(basename "$LINUX_APPIMAGE")"
          WINDOWS_FILE="$(basename "$WINDOWS_EXE")"
          RELEASE_BASE="https://github.com/knight2215/agent-harbor/releases/download/${GITHUB_REF_NAME}"

          # Signature contents are read verbatim and passed to jq as raw strings
          # (`--rawfile`) so jq escapes them into valid JSON string values.
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Automated release ${GITHUB_REF_NAME} of agent-harbor." \
            --arg pub_date "$PUB_DATE" \
            --rawfile linux_sig "$LINUX_SIG" \
            --arg linux_url "${RELEASE_BASE}/${LINUX_FILE}" \
            --rawfile windows_sig "$WINDOWS_SIG" \
            --arg windows_url "${RELEASE_BASE}/${WINDOWS_FILE}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64": { signature: $linux_sig, url: $linux_url },
                "windows-x86_64": { signature: $windows_sig, url: $windows_url }
              }
            }' > latest.json

          echo "Composed latest.json:" >&2
          cat latest.json >&2

      # Attach latest.json to the tag's GitHub Release. This one MUST match, so
      # `fail_on_unmatched_files: true` (unlike the per-OS installer globs).
      - name: Publish latest.json to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          fail_on_unmatched_files: true
