[package]
name = "tauri-app"
# These are intentionally concrete literals (kept in sync with the root
# `[workspace.package]`: version = "0.1.0", edition = "2021", license = "MIT")
# rather than `*.workspace = true` inheritance. This crate is under
# `[workspace] exclude` in the root Cargo.toml (see NOTE below), so it is not a
# member of any workspace. When CI builds it standalone via
# `--manifest-path crates/tauri-app/Cargo.toml`, there is no workspace root to
# inherit from, and `*.workspace = true` would fail to parse ("failed to find a
# workspace root"). Making the crate self-contained keeps the manifest parseable.
version = "0.5.0"
edition = "2021"
license = "MIT"

# NOTE: This crate depends on the external `tauri` crate (plus serde/serde_json),
# which resolves only where crates.io is reachable (CI). During the offline
# Phase 0 sandbox it is placed under `[workspace] exclude` in the root
# Cargo.toml (NOT under `members`), so bare offline cargo commands never try to
# resolve `tauri`. Because it is excluded from the workspace, `cargo build -p
# tauri-app` from the workspace root will NOT find it; CI builds it directly via
# `cargo build --manifest-path crates/tauri-app/Cargo.toml`.

[dependencies]
orchestrator-core = { path = "../orchestrator-core" }
providers = { path = "../providers" }
mcp-client = { path = "../mcp-client" }
routing = { path = "../routing" }
persistence = { path = "../persistence" }
secrets = { path = "../secrets" }
tauri = "2"
# Phase 8b (FEAT-001): the signed in-app self-updater. `tauri-plugin-updater`
# checks GitHub Releases `latest.json` + downloads/installs the signed update;
# `tauri-plugin-process` provides the relaunch after install. Concrete literal
# 2.x versions (same major style as `tauri = "2"`) because this crate is under
# `[workspace] exclude` and has no workspace root to inherit from.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime for the DB init (block_on) and the core-event bridge channel.
# Concrete literal versions (kept in sync with the root `[workspace.dependencies]`)
# because this crate is under `[workspace] exclude` and has no workspace root to
# inherit from when built via `--manifest-path`.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
# The restart-survival integration test (tests/restart_survival.rs) opens a
# temp SQLite file and drives async APIs. tauri-app is built/tested in CI via
# `--manifest-path`, where these resolve.
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The Phase 5 (FEAT-001) command unit tests construct `Message` values, whose
# `created_at` is a `chrono::DateTime<Utc>`. Concrete literal version (kept in
# sync with the root `[workspace.dependencies]`) because this crate is under
# `[workspace] exclude`.
chrono = { version = "0.4", features = ["serde"] }
