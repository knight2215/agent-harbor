[package]
name = "secrets"
# Concrete literals rather than `*.workspace = true` inheritance. This crate is
# under `[workspace] exclude` in the root Cargo.toml (it gained the crates.io
# `keyring` dependency in Phase 1 / FEAT-002, which is offline-unreachable), so
# it is not a member of any workspace. When CI builds it standalone via
# `--manifest-path crates/secrets/Cargo.toml`, there is no workspace root to
# inherit from, and `*.workspace = true` (for package keys OR for
# `<dep> = { workspace = true }`) would fail to parse. Keeping the manifest
# self-contained mirrors the Phase 0 `tauri-app` / FEAT-001 `orchestrator-core`
# precedent. Versions are kept in sync with the root `[workspace.dependencies]`
# table.
version = "0.1.0"
edition = "2021"
license = "MIT"

# First crates.io dependencies for this crate (Phase 1 / FEAT-002). `keyring`
# is unreachable in the offline sandbox (crates.io 403), which is why this crate
# moved from `members` to `[workspace] exclude` in the root Cargo.toml and is
# verified in CI - see the root Cargo.toml rationale and
# .github/workflows/ci.yml. Versions mirror the root `[workspace.dependencies]`
# table.
[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# keyring v3 MUST be pulled per-target with an explicit platform-store feature
# and `default-features = false`. This is the v0.8.1 keychain bug: keyring v3
# has NO default features and NO default credential store. Its own docs say
# "There are no default features in this crate: you must specify explicitly
# which platform-specific credential stores you intend to use" - and if no
# store feature applies to the build target it silently falls back to a
# platform-independent MOCK/no-op credential store. The v0.8.1 manifest declared
# `keyring = "3"` with no features, so on the user's Windows build every
# `store()` wrote to that volatile mock (which never errors and never persists
# to Windows Credential Manager). The config-write path saw a successful store
# and persisted a ProviderConfig row, the UI showed "saved", yet at the next
# enumeration / launch `resolve()` found nothing - the exact
# 'no secret found for handle gemini-cloud' / 'generic-openai-local' errors.
#
# Backend feature per target:
#   - Windows           -> `windows-native`  (Windows Credential Manager)
#   - macOS / iOS        -> `apple-native`   (macOS/iOS Keychain)
#   - Linux / *BSD       -> `linux-native`   (kernel keyutils storage)
# `linux-native` is deliberately chosen over the DBus `sync-secret-service`
# backend: keyutils builds and runs on the headless CI ubuntu runner WITHOUT a
# running Secret Service daemon and WITHOUT a system libdbus (or openssl) at
# build time, so `cargo build/test --manifest-path crates/secrets/Cargo.toml`
# resolves standalone in CI. (The automated tests still exercise only
# InMemorySecretStore; the keyring-backed round-trip stays `#[ignore]`d.)
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }

[dev-dependencies]
serde_json = "1"
