[package]
name = "secrets"
# Concrete literals rather than `*.workspace = true` inheritance. This crate is
# under `[workspace] exclude` in the root Cargo.toml (it gained the crates.io
# `keyring` dependency in Phase 1 / FEAT-002, which is offline-unreachable), so
# it is not a member of any workspace. When CI builds it standalone via
# `--manifest-path crates/secrets/Cargo.toml`, there is no workspace root to
# inherit from, and `*.workspace = true` (for package keys OR for
# `<dep> = { workspace = true }`) would fail to parse. Keeping the manifest
# self-contained mirrors the Phase 0 `tauri-app` / FEAT-001 `orchestrator-core`
# precedent. Versions are kept in sync with the root `[workspace.dependencies]`
# table.
version = "0.1.0"
edition = "2021"
license = "MIT"

# First crates.io dependencies for this crate (Phase 1 / FEAT-002). `keyring`
# is unreachable in the offline sandbox (crates.io 403), which is why this crate
# moved from `members` to `[workspace] exclude` in the root Cargo.toml and is
# verified in CI - see the root Cargo.toml rationale and
# .github/workflows/ci.yml. Versions mirror the root `[workspace.dependencies]`
# table.
[dependencies]
keyring = "3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
