[package]
name = "orchestrator-core"
# Concrete literals rather than `*.workspace = true` inheritance. This crate is
# under `[workspace] exclude` in the root Cargo.toml (it gained crates.io deps in
# Phase 1 / FEAT-001 that are offline-unreachable), so it is not a member of any
# workspace. When CI builds it standalone via
# `--manifest-path crates/orchestrator-core/Cargo.toml`, there is no workspace
# root to inherit from, and `*.workspace = true` (for package keys OR for
# `<dep> = { workspace = true }`) would fail to parse. Keeping the manifest
# self-contained mirrors the Phase 0 `tauri-app` manifest. Versions are kept in
# sync with the root `[workspace.dependencies]` table.
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
providers = { path = "../providers" }
mcp-client = { path = "../mcp-client" }
routing = { path = "../routing" }
persistence = { path = "../persistence" }
secrets = { path = "../secrets" }

# First crates.io dependencies in a library crate (Phase 1, FEAT-001). These are
# unreachable in the offline sandbox (crates.io 403), which is why this crate is
# under `[workspace] exclude` and verified in CI - see the root Cargo.toml
# rationale and .github/workflows/ci.yml. Versions mirror the root
# `[workspace.dependencies]` table.
#
# FEAT-002 adds `tokio` (the SessionManager is async and holds per-conversation
# async locks per Section 7.5). The `persistence` path dep gives the
# SessionManager its repositories; `secrets` (already above) is the canonical
# home of `SecretRef`, re-exported by this crate's models.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
