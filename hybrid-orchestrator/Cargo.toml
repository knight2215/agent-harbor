[workspace]
resolver = "2"
# Offline-buildable members: the crates that are still dependency-free (no
# crates.io deps) and therefore resolve and build in the offline sandbox
# (INTEGRATIONS_ONLY: crates.io returns 403). `cargo build --workspace` below
# exercises exactly these.
#
# Phase 1 (FEAT-001) introduced the FIRST crates.io dependencies into a library
# crate: `orchestrator-core` pulls serde/serde_json/uuid/chrono/thiserror for
# the Section 7.1 domain models. Cargo resolves the *entire* `members`
# dependency graph to build `Cargo.lock`, so a member that depends on an
# offline-unreachable crate breaks every bare cargo command offline. This is the
# exact situation `tauri-app` was in during Phase 0. The established remedy is to
# move the networked crate under `[workspace] exclude` and build it explicitly
# in CI via `--manifest-path` (CI has network). We extended that pattern to
# `orchestrator-core` in FEAT-001.
#
# Phase 1 (FEAT-002) gives `persistence` its own crates.io deps (sqlx + tokio +
# serde/serde_json/uuid/chrono/thiserror) and `secrets` the `keyring` crate. Per
# the plan FEAT-001 established, both therefore MOVE from `members` to `exclude`
# here and gain explicit CI `--manifest-path` build/test/clippy/fmt steps.
#
# Phase 1 remediation (FEAT-004, cycle-break): the shared Section 7.1 domain DTOs
# were extracted into a new leaf crate `domain` to break a hard `cargo` cyclic
# dependency between `orchestrator-core` and `persistence` (each had a normal
# path dep on the other). `domain` carries serde/serde_json/uuid/chrono and a
# path dep on `secrets`, so - like the others - it is offline-unreachable and
# joins `exclude` with its own explicit CI `--manifest-path` steps. Both
# `orchestrator-core` and `persistence` now depend DOWNWARD on `domain`, and the
# `persistence -> orchestrator-core` reverse edge is removed, restoring the
# strictly-downward graph (Section 3.3).
#
# Phase 2 (FEAT-001) gives `providers` its own crates.io deps: an async HTTP
# client + SSE streaming (reqwest with rustls-tls), `futures`/`futures-util`
# (BoxStream), `tokio`, `async-trait`, serde/serde_json/thiserror, plus
# `aws-sigv4` + `aws-credential-types` for the later Bedrock adapter (P2.9).
# All of those are crates.io-only, unreachable in the offline sandbox. Per the
# same pattern established for the crates above, `providers` therefore MOVES
# from `members` to `exclude` here and gains explicit CI `--manifest-path`
# build/test/clippy/fmt steps. Its tests use MOCKED HTTP + SSE (wiremock),
# never live network.
#
# Phase 3 (FEAT-001) gives `mcp-client` its own crates.io deps: tokio (process/
# io/sync/time for the stdio transport + timeouts), serde/serde_json (the
# in-crate JSON-RPC 2.0 layer), reqwest with rustls-tls + rustls/`ring` and
# futures/futures-util/bytes (the HTTP/SSE transport + SSE decoder, mirroring
# `providers`), async-trait (the `Transport` trait), and thiserror. All are
# crates.io-only, unreachable in the offline sandbox. Per the same pattern
# established for the crates above, `mcp-client` therefore MOVES from `members`
# to `exclude` here and gains explicit CI `--manifest-path` build/test/clippy/
# fmt steps (the CI step ADDITIONS land in FEAT-002). Its stdio tests spawn a
# bundled CROSS-PLATFORM mock MCP server (a `[[bin]]` in the crate), never live
# network; the HTTP/SSE transport is exercised against a mocked server.
#
# Phase 4 (FEAT-001) fills in the `routing` crate with the real policy engine,
# giving it path deps on `providers` and `domain`. Both of those carry crates.io
# deps transitively (reqwest/sqlx/keyring/...), so `routing` is now
# offline-unreachable too. Following the SAME pattern as every crate above, it
# therefore MOVES from `members` to `exclude` and gains explicit CI
# `--manifest-path crates/routing/Cargo.toml` build/test/clippy/fmt steps. Its
# unit tests use no live network (they build in-memory `AvailableModel`
# candidates directly).
#
# With `routing` moved out, NO crate remains an offline-buildable `members`
# entry: every crate in the tree now carries crates.io deps (directly or
# transitively). The `members` array is kept present but EMPTY (do NOT delete
# the key) so the workspace stays well-formed; `cargo build --workspace` simply
# builds nothing offline, which is acceptable and fully covered by the per-crate
# CI steps. Every crate is validated in CI via `--manifest-path`.
members = []

# Excluded (networked) crates: NOT workspace members because they depend on
# crates.io crates that cannot be resolved offline.
#
#   - `domain`:            serde/serde_json/uuid/chrono + path dep on `secrets`
#                          (FEAT-004). The leaf crate that owns the Section 7.1
#                          DTOs; both orchestrator-core and persistence depend
#                          downward on it.
#   - `orchestrator-core`: serde/serde_json/uuid/chrono/thiserror + tokio, and
#                          path deps on domain/persistence (FEAT-001/002/004).
#   - `persistence`:       sqlx + tokio + serde/serde_json/uuid/chrono/thiserror
#                          + a path dep on `domain` (FEAT-002/004). It NO LONGER
#                          depends on orchestrator-core (that reverse edge formed
#                          a cycle; removed in FEAT-004).
#   - `providers`:         reqwest (rustls-tls) + futures/futures-util + tokio +
#                          async-trait + serde/serde_json/thiserror + aws-sigv4/
#                          aws-credential-types (Bedrock P2.9), plus path deps on
#                          `domain` and `secrets` (Phase 2 / FEAT-001). Carries
#                          the crates.io HTTP/SSE/SigV4 stack, so it joined the
#                          excluded set in Phase 2; its tests use mocked HTTP+SSE.
#   - `mcp-client`:        tokio (process/io/sync/time) + serde/serde_json (the
#                          in-crate JSON-RPC 2.0 layer) + reqwest (rustls-tls) +
#                          rustls/`ring` + futures/futures-util/bytes (HTTP/SSE
#                          transport + SSE decoder) + async-trait + thiserror,
#                          plus path deps on `domain` and `providers` (for the
#                          reused `McpServerConfig`/`McpTransport` and
#                          `ToolSpec`/`ToolCall` types). Carries the crates.io
#                          process + HTTP/SSE stack, so it joined the excluded
#                          set in Phase 3 (FEAT-001); its stdio tests spawn a
#                          bundled cross-platform mock MCP server.
#   - `routing`:           async-trait + serde/serde_json + thiserror, plus path
#                          deps on `providers` and `domain` (Phase 4 / FEAT-001).
#                          It carries no crates.io deps of its own beyond those,
#                          but its path deps pull in the crates.io HTTP/DB/keyring
#                          stack transitively, so it joined the excluded set in
#                          Phase 4; its unit tests use no live network.
#   - `secrets`:           keyring + serde + thiserror (FEAT-002).
#   - `tauri-app`:         tauri + tauri-build + serde/serde_json (Phase 0).
#   - `engine`:            serde/thiserror/async-trait/futures-util/tokio + path
#                          deps on `providers` and `domain` (Strategy B /
#                          FEAT-001). It hosts the embedded local inference
#                          engine (llama.cpp family, in-process GGUF). Its heavy
#                          native llama.cpp binding (`llama-cpp-2`) is an OPTIONAL
#                          dep behind the DEFAULT-OFF `llama` cargo feature, so
#                          the routine per-crate build compiles a dependency-light
#                          STUB with NO native lib (like every other excluded
#                          crate, its path deps still pull in crates.io deps, so
#                          it joins the excluded set). The native `llama` path
#                          compiles a large C++ library needing a toolchain +
#                          submodule sources unreachable offline; it is proven
#                          only by a dedicated gated CI job, never the routine
#                          build.
#
# Cargo resolves the whole `members` dependency graph to build `Cargo.lock` even
# for crates excluded from `default-members`, so listing these under `members`
# would make every bare offline cargo command (build/test/clippy/fmt) fail
# because their crates.io deps are unreachable. Placing them under `exclude`
# keeps the offline baseline green while preserving the crates in the source
# tree for spec fidelity.
#
# HOW CI COVERS THEM (CI is the authoritative gate): GitHub Actions has network
# access, so it generates a lockfile that includes these crates' deps and
# builds/tests/clippies each one EXPLICITLY via
# `--manifest-path crates/<crate>/Cargo.toml` under `-D warnings`, on
# ubuntu/macOS/windows. `orchestrator-core` note in particular: it path-depends
# on the member library crates AND on the excluded `domain`/`persistence`
# crates, so building it standalone pulls those in through their paths, and its
# Section 3.3 dependency edges are compiled here. The graph is acyclic
# (`orchestrator-core -> {domain, persistence}`, `persistence -> domain`,
# `domain -> secrets`), so `cargo` resolves it cleanly - the FEAT-004 cycle-break
# is what makes these standalone per-crate builds resolve at all.
#
# KNOWN TRADEOFF (tracked, not permanent): because these crates are `exclude`d
# rather than non-default `members`, `cargo build --workspace` never sees them,
# so their Section 3.3 dependency edges are validated ONLY in CI, and their
# dependencies do not enter this workspace's `Cargo.lock`. Risk: a breaking
# change to a leaf crate's public API that affects an excluded crate will not
# surface in the offline default build - only in CI.
#
# EXIT PATH (do this once network access is available): move each excluded
# entry from `exclude` into `members` (keeping it out of `default-members` so
# bare offline `cargo build` still skips it), run a networked
# `cargo build -p domain -p mcp-client -p orchestrator-core -p persistence -p
# routing -p secrets -p tauri-app` to populate `Cargo.lock` with the full
# dependency graph, and commit
# the updated `Cargo.lock` in the same change. That reconnects the crates to the
# workspace lockfile without breaking the offline default build. The per-crate
# `--manifest-path` CI steps can then be collapsed back into `--workspace` runs.
exclude = [
    "crates/domain",
    "crates/engine",
    "crates/mcp-client",
    "crates/orchestrator-core",
    "crates/persistence",
    "crates/providers",
    "crates/routing",
    "crates/secrets",
    "crates/tauri-app",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"

# Centralized dependency versions for the whole workspace (Phase 1). Member and
# excluded crates alike reference these via `<dep> = { workspace = true }` so
# versions stay consistent in one place. Versions match what Phase 0 `tauri-app`
# already pins where applicable (serde 1, serde_json 1).
#
# FEAT-001 uses: serde, serde_json, uuid, chrono, thiserror.
# FEAT-002 consumes: sqlx (persistence), keyring (secrets), tokio
# (persistence + orchestrator-core SessionManager). `async-trait` is now used by
# the Phase 2 `providers` crate (the `ChatProvider` async trait). Phase 2 also
# introduces reqwest/futures/aws-sigv4/aws-credential-types, recorded below for
# documentation; the `providers` crate is `[workspace] exclude`d and pins these
# as concrete literals in its own manifest (an excluded crate has no workspace
# root to inherit from). Phase 3 `mcp-client` reuses this same set - tokio (with
# the `full` feature for process/io/sync/time), serde/serde_json, thiserror,
# async-trait, reqwest (rustls-tls), rustls (`ring`), futures/futures-util/bytes
# - plus no NEW workspace-level dep versions; it too is `[workspace] exclude`d
# and pins these as concrete literals in its own manifest. NOTE: because every crate that consumes these is under
# `[workspace] exclude`, the excluded crates cannot use `{ workspace = true }`
# (an excluded crate has no workspace root to inherit from); they pin the same
# versions as concrete literals in their own manifests, kept in sync with this
# table. This table remains the single place the intended versions are recorded
# and is the source of truth once the EXIT PATH above rejoins the crates as
# members. Declaring a version here does NOT pull the crate into any build until
# a crate actually depends on it.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
keyring = "3"
# Phase 2 (providers). rustls-tls is chosen over the default native-tls so the
# Windows CI runner does not need a system OpenSSL. These are recorded here for
# documentation and the EXIT PATH; the excluded `providers` crate pins them as
# concrete literals in its own manifest.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1"
aws-sigv4 = "1"
aws-credential-types = "1"
