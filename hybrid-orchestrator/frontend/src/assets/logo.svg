<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  role="img"
  aria-label="Agent Harbor logo"
>
  <title>Agent Harbor</title>
  <!--
    Hand-authored mark (Phase 7, FEAT-004).
    Motif: a harbor anchor fused with an agent-node/network glyph. The anchor's
    stock, crown, and flukes read as three connected nodes of a small graph; the
    shank is the graph's spine. Colors are baked in (teal/blue accent) because
    this renders as an <img src> asset where CSS currentColor does not inherit,
    so it stays legible on both light and dark sidebar surfaces. Self-contained:
    no external references, no filters, no background fill of its own.
  -->
  <defs>
    <linearGradient id="ahLogoStroke" x1="6" y1="3" x2="26" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2bbccf" />
      <stop offset="1" stop-color="#0d7d8c" />
    </linearGradient>
  </defs>

  <g
    fill="none"
    stroke="url(#ahLogoStroke)"
    stroke-width="2.1"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Shank: the graph spine running down the mark. -->
    <line x1="16" y1="9.6" x2="16" y2="23" />
    <!-- Stock: the crossbar whose ends are two connected agent nodes. -->
    <line x1="10" y1="12.4" x2="22" y2="12.4" />
    <!-- Crown + flukes: the anchor arms sweeping up to the outer nodes. -->
    <path d="M8.5 18.5c0 4.1 3.4 6.7 7.5 6.7s7.5-2.6 7.5-6.7" />
    <path d="M8.5 18.5l-2.4 1.1M8.5 18.5l1.9 2" />
    <path d="M23.5 18.5l2.4 1.1M23.5 18.5l-1.9 2" />
  </g>

  <!-- Network nodes: the ring (agent hub) and the two stock endpoints. -->
  <g fill="#2bbccf">
    <circle cx="16" cy="7" r="2.6" fill="none" stroke="#2bbccf" stroke-width="2.1" />
    <circle cx="10" cy="12.4" r="1.7" />
    <circle cx="22" cy="12.4" r="1.7" />
    <circle cx="6.1" cy="19.6" r="1.5" fill="#0d7d8c" />
    <circle cx="25.9" cy="19.6" r="1.5" fill="#0d7d8c" />
  </g>
</svg>
